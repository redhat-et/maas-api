name: Publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-maas-api
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Interim namespace: personal (quay.io/modden) with a repo-scoped
      # builder robot. Migration to an org-owned repo is a follow-up here
      # plus the cluster pull secret.
      IMAGE: quay.io/modden/enmaas-maas-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: maas-api/go.mod
          cache: false

      - name: Test
        working-directory: maas-api
        run: |
          go test -race ./...
          go vet ./...

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            -t "$IMAGE:main" \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -f maas-api/Dockerfile maas-api/

      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          printf '%s' "$QUAY_TOKEN" | docker login quay.io \
            -u "$QUAY_USERNAME" --password-stdin

      - name: Push full-SHA tag
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Record digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r '.digest')"
          test -n "$digest"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::unexpected digest: $digest"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published maas-api image"
            echo ""
            echo "\`$IMAGE@$digest\`"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- ref: \`$GITHUB_REF\`"
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Move main tag
        run: docker push "$IMAGE:main"

      - name: Log out of Quay
        if: always()
        run: docker logout quay.io || true
